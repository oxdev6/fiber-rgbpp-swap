<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Swap Ads — Fiber</title>
<style>
  :root {
    --bg: #f7f7f5;
    --panel: #ffffff;
    --ink: #111418;
    --muted: #73767e;
    --line: #e4e2dc;
    --green: #16794c;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 20px 24px 32px; }

  header { display: flex; align-items: baseline; justify-content: space-between; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 15px; font-weight: 650; }
  header h1 span { color: var(--muted); font-weight: 400; }
  .nodes { font-size: 12px; color: var(--muted); font-family: var(--mono); }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #c9c5b9; margin: 0 5px 0 12px; }
  .dot.ok { background: var(--green); } .dot.bad { background: #c2410c; }

  .flow { display: flex; align-items: center; gap: 8px; margin: 14px 0; font-size: 12px; color: var(--muted); }
  .flow .st { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; white-space: nowrap; }
  .flow .st b { color: var(--ink); font-weight: 600; }
  .flow .st.done { border-color: #bcd9c8; }
  .flow .st.done b { color: var(--green); }
  .flow .st.todo { border-style: dashed; opacity: .75; }
  .flow .arr { color: #b9b5a8; }
  .flow .jstat { font-family: var(--mono); font-size: 11px; color: var(--green); }
  .flow .st.todo .jstat { color: var(--muted); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px 14px; }
  .panel h2 { margin: 0; font-size: 13px; font-weight: 650; }
  .panel h2 span { color: var(--muted); font-weight: 400; font-family: var(--mono); font-size: 11.5px; }
  .ctl { display: flex; gap: 8px; margin-top: 10px; }
  .ctl input {
    padding: 6px 8px; font-size: 13px; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px; outline: none;
    min-width: 0;
  }
  .ctl input:focus { border-color: var(--ink); }
  .ctl input[type="number"] { width: 76px; }
  .ctl input[type="text"] { flex: 1; font-family: var(--mono); font-size: 11.5px; }
  button {
    padding: 6px 14px; font-size: 13px; font-weight: 600; white-space: nowrap;
    color: #fff; background: var(--ink); border: 1px solid var(--ink);
    border-radius: 6px; cursor: pointer;
  }
  button:hover { background: #000; }
  button:disabled { opacity: .5; cursor: wait; }
  button.secondary { background: transparent; color: var(--ink); }
  button.secondary:hover { background: var(--bg); }
  #pub-state { font-size: 12px; color: var(--muted); margin-left: 8px; }

  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th { text-align: left; font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 4px 6px; border-bottom: 1px solid var(--line); }
  td { padding: 6px; border-bottom: 1px solid #f0eee8; font-size: 12.5px; }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-family: var(--mono); font-size: 12px; }
  td.key { font-family: var(--mono); font-size: 11.5px; color: var(--ink); }
  .hex { color: var(--muted); font-size: 10.5px; }
  .empty { padding: 12px 2px; color: var(--muted); font-size: 12.5px; }

  .best { display: flex; align-items: baseline; gap: 10px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
  .best b { font-family: var(--mono); font-size: 17px; color: var(--ink); font-weight: 650; }
  #best-box .k { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }

  #log { margin-top: 12px; font-family: var(--mono); font-size: 11.5px; color: var(--muted); min-height: 18px; }
  #log .t { margin-right: 8px; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>swap-ads <span>/ fiber market board</span></h1>
    <div class="nodes"><span class="dot" id="dot-hub"></span>hub :8327 <span id="hub-state">…</span><span class="dot" id="dot-lis"></span>listener :8328 <span id="lis-state">…</span></div>
  </header>

  <div class="flow" id="journey">
    <span class="st" id="j1"><b>1 · advertise</b> <span class="jstat">…</span></span><span class="arr">→</span>
    <span class="st" id="j2"><b>2 · discover</b> <span class="jstat">…</span></span><span class="arr">→</span>
    <span class="st todo" id="j3"><b>3 · leap</b> <span class="jstat">next</span></span><span class="arr">→</span>
    <span class="st todo" id="j4"><b>4 · swap</b> <span class="jstat">next</span></span>
  </div>

  <div class="grid">
    <section class="panel">
      <h2>Hub <span>127.0.0.1:8327</span></h2>
      <div class="ctl">
        <input id="rate" type="number" value="100" min="1" title="Rate (quote per base)" />
        <input id="fee" type="number" value="3000" min="0" title="Fee per million" />
        <input id="days" type="number" value="1" min="1" title="Valid days" />
        <button id="btn-publish" onclick="publish()">Publish</button>
      </div>
      <span id="pub-state"></span>
      <div id="hub-book"><div class="empty">—</div></div>
    </section>

    <section class="panel">
      <h2>Listener <span>127.0.0.1:8328</span></h2>
      <div class="ctl">
        <input id="peer" type="text" value="/ip4/127.0.0.1/tcp/8829/p2p/QmdccqCxFC8jSf6vj9cob7gRxHWEuMaji9HaHaKV6nATYJ" />
        <button class="secondary" onclick="connectPeer()">Connect</button>
      </div>
      <div class="best" id="best-box"><span class="k">Best</span>—</div>
      <div id="lis-book"><div class="empty">—</div></div>
    </section>
  </div>

  <div id="log"></div>

</div>

<script>
const HUB = "http://127.0.0.1:8327";
const LIS = "http://127.0.0.1:8328";

function log(msg) {
  const el = document.getElementById("log");
  const t = new Date().toLocaleTimeString();
  el.textContent = t + "  " + msg;
}

async function rpc(url, method, params, timeoutMs = 20000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: 1, jsonrpc: "2.0", method, params }),
      signal: ctrl.signal,
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
    return data.result;
  } finally {
    clearTimeout(timer);
  }
}

const hexToBig = (h) => BigInt(h);
const fmtRate = (r) => (hexToBig(r) / 100000000n).toString();
const shortKey = (k) => k.slice(0, 8);
const fmtExpiry = (e) => new Date(Number(hexToBig(e))).toLocaleDateString(undefined, { month: "short", day: "numeric" });

function bookTable(offers) {
  if (!offers.length) return '<div class="empty">No offers.</div>';
  let html = "<table><thead><tr><th class='num'>Rate</th><th class='num'>Fee</th><th>Operator</th><th>Expiry</th></tr></thead><tbody>";
  for (const o of offers) {
    html += "<tr><td class='num'>" + fmtRate(o.rate) + "</td><td class='num'>" +
      hexToBig(o.fee_rate) + "</td><td class='key'>" + shortKey(o.operator_pubkey) + "</td><td>" +
      fmtExpiry(o.expiry) + (o.is_expired ? " †" : "") + "</td></tr>";
  }
  return html + "</tbody></table>";
}

function setDot(id, ok) {
  const el = document.getElementById(id);
  el.classList.remove("ok", "bad");
  el.classList.add(ok ? "ok" : "bad");
}

function setJourney(id, text) {
  const el = document.querySelector("#" + id + " .jstat");
  if (el) el.textContent = text;
}

async function refreshBooks() {
  try {
    const a = await rpc(HUB, "list_swap_advertisements",
      [{ base_udt_script: null, quote_udt_script: null }]);
    document.getElementById("hub-book").innerHTML = bookTable(a.offers);
    document.getElementById("hub-state").textContent = a.offers.length + "";
    setDot("dot-hub", true);
    const j1 = document.getElementById("j1");
    j1.classList.toggle("done", a.offers.length > 0);
    setJourney("j1", a.offers.length ? a.offers.length + " live" : "—");
  } catch (e) {
    document.getElementById("hub-state").textContent = "down";
    setDot("dot-hub", false);
  }
  try {
    const b = await rpc(LIS, "list_swap_advertisements",
      [{ base_udt_script: null, quote_udt_script: null }]);
    document.getElementById("lis-book").innerHTML = bookTable(b.offers);
    document.getElementById("lis-state").textContent = b.offers.length + "";
    setDot("dot-lis", true);
    const j2 = document.getElementById("j2");
    j2.classList.toggle("done", b.offers.length > 0);
    setJourney("j2", b.offers.length ? b.offers.length + " found" : "—");
    const best = await rpc(LIS, "get_best_swap_rate",
      [{ base_udt_script: null, quote_udt_script: null }]);
    document.getElementById("best-box").innerHTML = best.offer
      ? "<span class='k'>Best</span><b>" + fmtRate(best.offer.rate) + "</b><span>" + shortKey(best.offer.operator_pubkey) + "</span>"
      : "<span class='k'>Best</span>—";
  } catch (e) {
    document.getElementById("lis-state").textContent = "down";
    setDot("dot-lis", false);
  }
}

async function publish() {
  const btn = document.getElementById("btn-publish");
  const st = document.getElementById("pub-state");
  const rateHuman = Math.max(1, Math.floor(Number(document.getElementById("rate").value) || 0));
  const fee = Math.max(0, Math.floor(Number(document.getElementById("fee").value) || 0));
  const days = Math.max(1, Math.floor(Number(document.getElementById("days").value) || 1));
  const rateRaw = BigInt(rateHuman) * 100000000n;
  btn.disabled = true;
  st.textContent = "…";
  log("publishing at " + rateHuman);
  try {
    await rpc(HUB, "publish_swap_advertisement", [{
      base_udt_script: null, quote_udt_script: null,
      rate: "0x" + rateRaw.toString(16),
      fee_rate: "0x" + BigInt(fee).toString(16),
      expiry_delta_millis: "0x" + BigInt(days * 86400000).toString(16),
    }], 150000);
    log("published at " + rateHuman);
  } catch (e) {
    log("publish slow (" + e.message + ") — row appears anyway");
  }
  st.textContent = "";
  btn.disabled = false;
  await refreshBooks();
}

async function connectPeer() {
  const addr = document.getElementById("peer").value.trim();
  try {
    await rpc(HUB, "connect_peer", [{ address: addr }]);
    log("peering requested");
  } catch (e) {
    log("connect failed: " + e.message);
  }
  await refreshBooks();
}

refreshBooks();
setInterval(refreshBooks, 5000);
</script>
</body>
</html>
