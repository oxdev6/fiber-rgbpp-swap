<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Swap Ads — Fiber</title>
<style>
  :root {
    --bg: #04060a;
    --panel: #0b0e13;
    --ink: #f2f5f7;
    --muted: #8b94a1;
    --faint: #4a515c;
    --line: rgba(255,255,255,.09);
    --acc: #6cb8ff;
    --green: #34d399;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 12% 22%, rgba(255,255,255,.5), transparent),
      radial-gradient(1px 1px at 68% 8%, rgba(255,255,255,.4), transparent),
      radial-gradient(1px 1px at 84% 34%, rgba(255,255,255,.35), transparent),
      radial-gradient(1px 1px at 32% 12%, rgba(255,255,255,.3), transparent),
      radial-gradient(1px 1px at 52% 28%, rgba(255,255,255,.28), transparent),
      radial-gradient(1px 1px at 6% 62%, rgba(255,255,255,.3), transparent),
      radial-gradient(1px 1px at 92% 68%, rgba(255,255,255,.3), transparent),
      radial-gradient(1px 1px at 44% 82%, rgba(255,255,255,.25), transparent),
      radial-gradient(1px 1px at 74% 88%, rgba(255,255,255,.25), transparent),
      radial-gradient(600px 300px at 50% -80px, rgba(108,184,255,.07), transparent);
  }
  .wrap { position: relative; max-width: 1060px; margin: 0 auto; padding: 26px 28px 40px; }

  /* top bar */
  .top { display: flex; align-items: center; justify-content: space-between; }
  .brand { font-size: 14px; font-weight: 700; letter-spacing: .18em; }
  .brand span { color: var(--muted); font-weight: 400; letter-spacing: .08em; }
  .online {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 11px; font-weight: 700; letter-spacing: .14em;
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px;
    background: rgba(255,255,255,.02);
  }
  .online .dot { width: 7px; height: 7px; border-radius: 50%; background: #3a3f47; }
  .online .dot.ok { background: var(--green); box-shadow: 0 0 8px rgba(52,211,153,.9); animation: pulse 2.4s infinite; }
  .online .dot.bad { background: #f87171; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
  .online .sep { color: var(--faint); font-weight: 400; letter-spacing: .04em; }

  /* hero stats */
  .hero { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 12px; margin: 30px 0 8px; }
  @media (max-width: 760px) { .hero { grid-template-columns: 1fr; } }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px 16px; }
  .stat .k { font-size: 10.5px; font-weight: 700; letter-spacing: .16em; color: var(--muted); }
  .stat .v { font-size: 52px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .stat .v small { font-size: 15px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
  .stat.hero-best .v { color: #fff; text-shadow: 0 0 34px rgba(108,184,255,.35); }
  .stat .sub { font-size: 11.5px; color: var(--muted); font-family: var(--mono); margin-top: 2px; }
  #best-box .k { display: none; }

  /* nodes row */
  .nodes { display: flex; gap: 16px; font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin: 10px 2px 0; }
  .nodes .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #3a3f47; margin-right: 6px; }
  .nodes .dot.ok { background: var(--green); box-shadow: 0 0 8px rgba(52,211,153,.9); }
  .nodes .dot.bad { background: #f87171; }

  /* journey */
  .flow { display: flex; align-items: center; gap: 0; margin: 22px 0 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .flow .st { flex: 1; padding: 11px 14px; font-size: 12px; color: var(--muted); border-left: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .flow .st:first-child { border-left: 0; }
  .flow .st b { color: var(--ink); font-weight: 600; }
  .flow .st .jstat { font-family: var(--mono); font-size: 11px; color: var(--acc); display: block; margin-top: 1px; }
  .flow .st.todo { opacity: .55; }
  .flow .st.todo .jstat { color: var(--faint); }

  /* panels */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px 18px; }
  .panel h2 { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: .16em; color: var(--muted); }
  .panel h2 span { font-family: var(--mono); letter-spacing: 0; font-weight: 400; }
  .ctl { display: flex; gap: 8px; margin-top: 12px; }
  .ctl input {
    padding: 9px 10px; font-size: 13px; color: var(--ink);
    background: rgba(255,255,255,.03); border: 1px solid var(--line);
    border-radius: 9px; outline: none; min-width: 0;
  }
  .ctl input:focus { border-color: var(--acc); }
  .ctl input[type="number"] { width: 74px; font-family: var(--mono); }
  .ctl input[type="text"] { flex: 1; font-family: var(--mono); font-size: 11px; }
  button {
    padding: 9px 18px; font-size: 13px; font-weight: 650; white-space: nowrap;
    color: #04121f; background: var(--acc); border: 0;
    border-radius: 9px; cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: .5; cursor: wait; }
  button.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  button.secondary:hover { border-color: var(--muted); }
  #pub-state { font-size: 12px; color: var(--muted); margin-left: 8px; }

  table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  th { text-align: left; font-size: 10px; font-weight: 700; letter-spacing: .12em; color: var(--faint); padding: 6px; border-bottom: 1px solid var(--line); }
  td { padding: 9px 6px; border-bottom: 1px solid rgba(255,255,255,.05); font-size: 13px; }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-family: var(--mono); font-size: 12.5px; }
  td.key { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  .empty { padding: 16px 2px; color: var(--faint); font-size: 13px; }

  #log { margin-top: 12px; font-family: var(--mono); font-size: 11.5px; color: var(--faint); min-height: 18px; }
  #log .t { margin-right: 8px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand">SWAP·ADS <span>/ FIBER</span></div>
    <div class="online"><span class="dot" id="dot-hub"></span><span id="hub-state">…</span><span class="sep">·</span><span class="dot" id="dot-lis"></span><span id="lis-state">…</span></div>
  </div>

  <div class="hero">
    <div class="stat hero-best">
      <div class="k">Best rate · quote / base</div>
      <div class="v" id="best-box">—</div>
      <div class="sub" id="best-sub">listening…</div>
    </div>
    <div class="stat">
      <div class="k">Hub offers</div>
      <div class="v" id="hub-count">—</div>
      <div class="sub">127.0.0.1:8327</div>
    </div>
    <div class="stat">
      <div class="k">Listener offers</div>
      <div class="v" id="lis-count">—</div>
      <div class="sub">127.0.0.1:8328 · gossip sync</div>
    </div>
  </div>

  <div class="nodes" style="display:none"></div>

  <div class="flow" id="journey">
    <div class="st" id="j1"><b>01 Advertise</b><span class="jstat">…</span></div>
    <div class="st" id="j2"><b>02 Discover</b><span class="jstat">…</span></div>
    <div class="st todo" id="j3"><b>03 Leap</b><span class="jstat">next</span></div>
    <div class="st todo" id="j4"><b>04 Swap</b><span class="jstat">next</span></div>
  </div>

  <div class="grid">
    <section class="panel">
      <h2>HUB <span>· publish</span></h2>
      <div class="ctl">
        <input id="rate" type="number" value="100" min="1" title="Rate (quote per base)" />
        <input id="fee" type="number" value="3000" min="0" title="Fee per million" />
        <input id="days" type="number" value="1" min="1" title="Valid days" />
        <button id="btn-publish" onclick="publish()">Publish</button>
      </div>
      <span id="pub-state"></span>
      <div id="hub-book"><div class="empty">—</div></div>
    </section>

    <section class="panel">
      <h2>LISTENER <span>· discover</span></h2>
      <div class="ctl">
        <input id="peer" type="text" value="/ip4/127.0.0.1/tcp/8829/p2p/QmdccqCxFC8jSf6vj9cob7gRxHWEuMaji9HaHaKV6nATYJ" />
        <button class="secondary" onclick="connectPeer()">Connect</button>
      </div>
      <div id="lis-book"><div class="empty">—</div></div>
    </section>
  </div>

  <div id="log"></div>

</div>

<script>
const HUB = "http://127.0.0.1:8327";
const LIS = "http://127.0.0.1:8328";

function log(msg) {
  const el = document.getElementById("log");
  const t = new Date().toLocaleTimeString();
  el.textContent = t + "  " + msg;
}

async function rpc(url, method, params, timeoutMs = 20000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: 1, jsonrpc: "2.0", method, params }),
      signal: ctrl.signal,
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
    return data.result;
  } finally {
    clearTimeout(timer);
  }
}

const hexToBig = (h) => BigInt(h);
const fmtRate = (r) => (hexToBig(r) / 100000000n).toString();
const shortKey = (k) => k.slice(0, 8);
const fmtExpiry = (e) => new Date(Number(hexToBig(e))).toLocaleDateString(undefined, { month: "short", day: "numeric" });

function bookTable(offers) {
  if (!offers.length) return '<div class="empty">No offers.</div>';
  let html = "<table><thead><tr><th class='num'>Rate</th><th class='num'>Fee</th><th>Operator</th><th>Expiry</th></tr></thead><tbody>";
  for (const o of offers) {
    html += "<tr><td class='num'>" + fmtRate(o.rate) + "</td><td class='num'>" +
      hexToBig(o.fee_rate) + "</td><td class='key'>" + shortKey(o.operator_pubkey) + "</td><td>" +
      fmtExpiry(o.expiry) + (o.is_expired ? " †" : "") + "</td></tr>";
  }
  return html + "</tbody></table>";
}

function setDot(id, ok) {
  const el = document.getElementById(id);
  el.classList.remove("ok", "bad");
  el.classList.add(ok ? "ok" : "bad");
}

function setJourney(id, text) {
  const el = document.querySelector("#" + id + " .jstat");
  if (el) el.textContent = text;
}

function setCount(id, n) {
  const el = document.getElementById(id);
  if (el) el.textContent = n;
}

async function refreshBooks() {
  try {
    const a = await rpc(HUB, "list_swap_advertisements",
      [{ base_udt_script: null, quote_udt_script: null }]);
    document.getElementById("hub-book").innerHTML = bookTable(a.offers);
    document.getElementById("hub-state").textContent = a.offers.length + " offers";
    setCount("hub-count", a.offers.length);
    setDot("dot-hub", true);
    setJourney("j1", a.offers.length ? a.offers.length + " live" : "—");
  } catch (e) {
    document.getElementById("hub-state").textContent = "offline";
    setDot("dot-hub", false);
  }
  try {
    const b = await rpc(LIS, "list_swap_advertisements",
      [{ base_udt_script: null, quote_udt_script: null }]);
    document.getElementById("lis-book").innerHTML = bookTable(b.offers);
    document.getElementById("lis-state").textContent = b.offers.length + " offers";
    setCount("lis-count", b.offers.length);
    setDot("dot-lis", true);
    setJourney("j2", b.offers.length ? b.offers.length + " found" : "—");
    const best = await rpc(LIS, "get_best_swap_rate",
      [{ base_udt_script: null, quote_udt_script: null }]);
    if (best.offer) {
      document.getElementById("best-box").innerHTML = fmtRate(best.offer.rate);
      document.getElementById("best-sub").textContent = "from " + shortKey(best.offer.operator_pubkey) + " · live";
    } else {
      document.getElementById("best-box").innerHTML = "—";
      document.getElementById("best-sub").textContent = "no offers yet";
    }
  } catch (e) {
    document.getElementById("lis-state").textContent = "offline";
    setDot("dot-lis", false);
  }
}

async function publish() {
  const btn = document.getElementById("btn-publish");
  const st = document.getElementById("pub-state");
  const rateHuman = Math.max(1, Math.floor(Number(document.getElementById("rate").value) || 0));
  const fee = Math.max(0, Math.floor(Number(document.getElementById("fee").value) || 0));
  const days = Math.max(1, Math.floor(Number(document.getElementById("days").value) || 1));
  const rateRaw = BigInt(rateHuman) * 100000000n;
  btn.disabled = true;
  st.textContent = "…";
  log("publishing at " + rateHuman);
  try {
    await rpc(HUB, "publish_swap_advertisement", [{
      base_udt_script: null, quote_udt_script: null,
      rate: "0x" + rateRaw.toString(16),
      fee_rate: "0x" + BigInt(fee).toString(16),
      expiry_delta_millis: "0x" + BigInt(days * 86400000).toString(16),
    }], 150000);
    log("published at " + rateHuman);
  } catch (e) {
    log("publish slow (" + e.message + ") — row appears anyway");
  }
  st.textContent = "";
  btn.disabled = false;
  await refreshBooks();
}

async function connectPeer() {
  const addr = document.getElementById("peer").value.trim();
  try {
    await rpc(HUB, "connect_peer", [{ address: addr }]);
    log("peering requested");
  } catch (e) {
    log("connect failed: " + e.message);
  }
  await refreshBooks();
}

refreshBooks();
setInterval(refreshBooks, 5000);
</script>
</body>
</html>
