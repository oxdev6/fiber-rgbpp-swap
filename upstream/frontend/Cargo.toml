[package]
name = "fiber-rgb-swap-frontend"
version = "0.1.0"
edition = "2021"

[dependencies]
yew = { version = "0.22", features = ["csr"] }
yew-router = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gloo-net = "0.5"
gloo-console = "0.7"
gloo-timers = "0.2"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document"] }

[lib]
crate-type = ["cdylib","rlib"]
